server {
    listen 80;
    listen [::]:80;
    server_name printvodiy.uz www.printvodiy.uz;

    root /var/www/printvodiy.uz;
    index index.html;

    # The page itself is never cached, so a new deploy shows up at once —
    # also in the Vodiyprint app, which has no reload button. (Built JS/CSS
    # have hashed names and are cached below.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vodiyprint Android app (.github/workflows/android.yml): the APK, and
    # the file that lets Chrome open the app without an address bar.
    location = /app.apk {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'attachment; filename="Vodiyprint.apk"';
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    # Service worker for the push notifications: always fresh.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Webhooks (Meta Lead Ads, Mois Zvonki calls, ...) — all proxied to
    # the standalone Node process managed by meta-webhook.service, which
    # owns the specific /webhooks/... routes itself.
    # Video uploads for the Marketolog's analysis (Kontent page), up to
    # 500 MB, streamed straight to the Node process.
    location /webhooks/content/ {
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The company site's form (meta-webhook/siteLeads.js) — up to a 8 MB logo.
    location = /webhooks/site-lead {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Kompaniya sayti (website/ in the repo) — for now at /sayt/, until it
    # gets its own domain.
    location ^~ /sayt/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /sayt/index.html;
        location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
    location = /sayt {
        return 301 /sayt/;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
