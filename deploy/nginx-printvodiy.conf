server {
    listen 80;
    listen [::]:80;
    server_name printvodiy.uz www.printvodiy.uz;

    root /var/www/printvodiy.uz;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Webhooks (Meta Lead Ads, Mois Zvonki calls, ...) — all proxied to
    # the standalone Node process managed by meta-webhook.service, which
    # owns the specific /webhooks/... routes itself.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
