// Vodiyprint Android ilovasi: a Trusted Web Activity that opens
// https://printvodiy.uz full screen in Chrome (camera, location, file
// downloads and the login all work as in the browser). Built and signed by
// .github/workflows/android.yml; the signing key lives on the server.
plugins {
    id "com.android.application"
}

def env = System.getenv()

android {
    namespace "uz.printvodiy.app"
    compileSdk 34

    defaultConfig {
        applicationId "uz.printvodiy.app"
        minSdk 21
        targetSdk 34
        versionCode (env.VERSION_CODE ?: "1") as int
        versionName "1.0.${env.VERSION_CODE ?: "0"}"
    }

    signingConfigs {
        release {
            if (env.KEYSTORE_FILE) {
                storeFile file(env.KEYSTORE_FILE)
                storePassword env.KEYSTORE_PASSWORD
                keyAlias "vodiyprint"
                keyPassword env.KEYSTORE_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig env.KEYSTORE_FILE ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
