name: Fix order dates

# Run by hand to move orders that were entered later (e.g. all on the last
# day of the month) to the day they were really taken, from the manager's
# Excel. The payload lists only order ids and days — no personal data.
# With apply=no it only prints what would change; with apply=yes it writes
# the new order_date (keeping its time part) and one audit document per
# order in data_fixes with the old value, so a change can be undone. An
# order whose current day is not the expected old day is skipped.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "base64(gzip(JSON [[orderId, oldDay YYYY-MM-DD, newDay YYYY-MM-DD], ...]))"
        required: true
      apply:
        description: "yes = write the changes, no = only show them"
        required: false
        default: "no"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix order dates
        uses: appleboy/ssh-action@v1
        env:
          PAYLOAD: ${{ inputs.payload }}
          APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: PAYLOAD,APPLY
          command_timeout: 5m
          script: |
            cat > /tmp/vp-fix-dates.js <<'JS'
            const zlib = require("zlib");
            const admin = require("/opt/meta-webhook/node_modules/firebase-admin");
            admin.initializeApp({ credential: admin.credential.cert(require("/opt/meta-webhook/service-account.json")) });
            const db = admin.firestore();
            const fixes = JSON.parse(zlib.gunzipSync(Buffer.from(process.env.PAYLOAD || "", "base64")).toString());
            const apply = process.env.APPLY === "yes";
            (async () => {
              const now = new Date().toISOString();
              let ok = 0, skipped = 0;
              for (const [oid, oldDay, newDay] of fixes) {
                const ref = db.collection("orders").doc(oid);
                const snap = await ref.get();
                if (!snap.exists) { console.log(`SKIP ${oid} not found`); skipped++; continue; }
                const before = String(snap.data().order_date || "");
                if (before.slice(0, 10) !== oldDay) { console.log(`SKIP ${oid} day is ${before.slice(0, 10)}, expected ${oldDay}`); skipped++; continue; }
                const after = newDay + before.slice(10);
                const pays = (await db.collection("order_payments").where("order_id", "==", oid).get()).docs.map((p) => String(p.data().payment_date || "").slice(0, 10));
                console.log(`FIX ${oid} ${before} -> ${after} payments=${pays.join("/") || "-"}`);
                ok++;
                if (!apply) continue;
                const b = db.batch();
                b.update(ref, { order_date: after, updated_at: now });
                b.set(db.collection("data_fixes").doc(), { kind: "order_date_from_excel", order_id: oid, before: { order_date: before }, after: { order_date: after }, created_at: now });
                await b.commit();
              }
              console.log(`${apply ? "APPLIED" : "DRY RUN"} fixed=${ok} skipped=${skipped}`);
              process.exit(0);
            })().catch((e) => { console.error("fix failed", e.message); process.exit(1); });
            JS
            NODE_PATH=/opt/meta-webhook/node_modules node /tmp/vp-fix-dates.js
            rm -f /tmp/vp-fix-dates.js
