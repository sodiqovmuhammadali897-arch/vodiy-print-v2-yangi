name: Old customers — start message (sends, owner-approved)

# Sends each recall manager (RECALL_MANAGERS) the start message
# (recall.js startText): «Assalomu alaykum, …! Rahbar buyrug'iga asosan …»,
# with how many of today's customers are still unmarked. The customers
# themselves keep coming from the server, one at a time. apply=no only
# prints who would get it. Owner asked on 2026-11-20. Logs: names, counts.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "yes = send; no = only show"
        default: "no"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        uses: appleboy/ssh-action@v1
        env:
          APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: APPLY
          command_timeout: 5m
          script: |
            cat > /tmp/vp-ra.js <<'JS'
            const fs = require("fs");
            for (const l of fs.readFileSync("/opt/meta-webhook/.env", "utf8").split("\n")) {
              const i = l.indexOf("=");
              if (i > 0 && !l.trim().startsWith("#") && !(l.slice(0, i).trim() in process.env)) process.env[l.slice(0, i).trim()] = l.slice(i + 1).trim();
            }
            const admin = require("/opt/meta-webhook/node_modules/firebase-admin");
            admin.initializeApp({ credential: admin.credential.cert(require("/opt/meta-webhook/service-account.json")) });
            const db = admin.firestore();
            const R = require("/opt/meta-webhook/recall.js");
            const { telegram } = require("/opt/meta-webhook/telegram.js");
            const { todayCode } = require("/opt/meta-webhook/shared.js");
            (async () => {
              const team = await R.create(db).managers();
              const today = todayCode();
              const todays = (await db.collection("recall_calls").where("day", "==", today).get()).docs.map((d) => d.data());
              for (const m of team) {
                const open = todays.filter((c) => c.manager_id === m.manager_id && c.status === "sent").length;
                console.log(`${m.first || m.name}: unmarked today ${open}`);
                if (process.env.APPLY !== "yes") continue;
                const r = await telegram("sendMessage", { chat_id: m.chat, text: R.startText(m.first || m.name, open) }).catch((e) => ({ ok: false, error: e.message }));
                console.log(`  sent: ${r && r.ok !== false ? "yes" : "no " + (r && r.error)}`);
              }
              if (process.env.APPLY !== "yes") console.log("apply=no — nothing sent");
              process.exit(0);
            })().catch((e) => { console.log("failed:", e.message); process.exit(1); });
            JS
            NODE_PATH=/opt/meta-webhook/node_modules node /tmp/vp-ra.js; rm -f /tmp/vp-ra.js
