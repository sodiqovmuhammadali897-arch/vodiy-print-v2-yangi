name: Promote app to everyone

# Run by hand after an urgent fix: puts the newest app version (which the
# owner's admin account already has) in front of every user now, instead
# of at 19:00. See deploy.yml «Publish build».

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            /usr/local/bin/vodiyprint-promote && echo "Everyone now gets the newest version" && ls -la /var/www/printvodiy.uz/index.html /var/www/printvodiy.uz/index-next.html
