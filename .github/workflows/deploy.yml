name: Deploy to printvodiy.uz

on:
  push:
    branches:
      - main
      - claude/server-talabini-ayt-s48oig
  workflow_dispatch: {}

concurrency:
  group: deploy-printvodiy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Write .env for build
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF

      - name: Build
        run: npm run build

      - name: Bootstrap server (nginx + certbot, safe to re-run)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S apt-get update -y
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S apt-get install -y nginx certbot python3-certbot-nginx
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S mkdir -p /var/www/printvodiy.uz
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S chown -R "${{ secrets.SERVER_USER }}" /var/www/printvodiy.uz

      - name: Upload nginx site config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deploy/nginx-printvodiy.conf"
          target: "/tmp"

      - name: Enable site + issue SSL certificate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S cp /tmp/deploy/nginx-printvodiy.conf /etc/nginx/sites-available/printvodiy.uz
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S ln -sf /etc/nginx/sites-available/printvodiy.uz /etc/nginx/sites-enabled/printvodiy.uz
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S rm -f /etc/nginx/sites-enabled/default
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S nginx -t
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S systemctl reload nginx
            echo "=== diagnostics ==="
            date -u
            getent hosts printvodiy.uz || true
            curl -sS -m 10 -o /dev/null -w "acme-v02 http_code=%{http_code}\n" https://acme-v02.api.letsencrypt.org/directory || echo "acme-v02 unreachable"
            echo "=== certbot ==="
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S certbot --nginx -d printvodiy.uz -d www.printvodiy.uz --non-interactive --agree-tos -m "${{ secrets.LETSENCRYPT_EMAIL }}" --redirect -v || true
            echo "=== certbot log tail ==="
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S tail -n 60 /var/log/letsencrypt/letsencrypt.log || true

      - name: Upload build output
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/*"
          target: "/var/www/printvodiy.uz"
          strip_components: 1

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "${{ secrets.SERVER_SUDO_PASSWORD }}" | sudo -S systemctl reload nginx

  # Deploys Cloud Functions (WebAuthn backend) and Firestore rules.
  # Skips itself via plain bash (not a workflow "if:") until
  # FIREBASE_SERVICE_ACCOUNT is added as a repo secret.
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Deploy functions and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret not set yet, skipping Cloud Functions deploy."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@13 deploy --only functions,firestore:rules --project vodiy-print --non-interactive
