name: Check orders list against the database (read only)

# Run by hand with a list of orders (e.g. from a PDF/Excel report) to see
# which customers and orders are already in Firestore. The list is sent
# hashed — phones, first names and brands as sha256 — so no personal data
# shows up in the run or its log. Prints one line per row with the result.
# Reads only.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "base64(gzip(JSON rows [i, ref, dd.mm.yyyy, [phoneHash], nameHash, brandHash, total]))"
        required: true
      inspect:
        description: "yes = also print the database amounts of orders whose total differs; ref = print the orders found by Excel ID with their lines; near = the customer orders within 45 days"
        required: false
        default: "no"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare with customers and orders
        uses: appleboy/ssh-action@v1
        env:
          PAYLOAD: ${{ inputs.payload }}
          INSPECT: ${{ inputs.inspect }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: PAYLOAD,INSPECT
          command_timeout: 5m
          script: |
            cat > /tmp/vp-check.js <<'JS'
            const zlib = require("zlib");
            const crypto = require("crypto");
            const admin = require("/opt/meta-webhook/node_modules/firebase-admin");
            admin.initializeApp({ credential: admin.credential.cert(require("/opt/meta-webhook/service-account.json")) });
            const db = admin.firestore();
            const rows = JSON.parse(zlib.gunzipSync(Buffer.from(process.env.PAYLOAD || "", "base64")).toString());
            const norm = (s) => String(s || "").toLowerCase().replace(/[‘’ʻ`]/g, "'").replace(/[^a-z0-9а-яё]/g, "");
            const h = (s) => (s ? crypto.createHash("sha256").update(s).digest("hex").slice(0, 16) : "");
            const p9 = (s) => { const d = String(s || "").replace(/\D/g, ""); return d.length >= 9 ? d.slice(-9) : ""; };
            (async () => {
              const [cs, os, ops, bs, pays] = await Promise.all(["customers", "orders", "order_products", "brands", "order_payments"].map((c) => db.collection(c).get()));
              const linesOf = new Map(), paidOf = new Map(), orderAt = new Map();
              for (const d of ops.docs) { const l = d.data(); if (!linesOf.has(l.order_id)) linesOf.set(l.order_id, []); linesOf.get(l.order_id).push(l); }
              for (const d of pays.docs) { const p = d.data(); paidOf.set(p.order_id, (paidOf.get(p.order_id) || 0) + Number(p.amount || 0)); }
              const byPhone = new Map(), byName = new Map(), byBrand = new Map();
              const add = (m, k, v) => { if (!k) return; if (!m.has(k)) m.set(k, new Set()); m.get(k).add(v); };
              for (const d of cs.docs) {
                const c = d.data();
                add(byPhone, h(p9(c.phone)), d.id); add(byPhone, h(p9(c.extra_phone)), d.id);
                add(byName, h(norm(String(c.first_name || "").split(/\s+/)[0])), d.id);
                add(byBrand, h(norm(c.company)), d.id);
              }
              for (const d of bs.docs) add(byBrand, h(norm(d.data().name)), d.data().customer_id);
              const refs = new Set(), byCustDay = new Map(), refOrders = new Map();
              for (const d of os.docs) {
                const o = d.data();
                for (const r of String(o.historical_ref || "").split(/,\s*/)) if (r) { refs.add(r.toLowerCase()); add(refOrders, r.toLowerCase(), d.id); }
                const day = String(o.order_date || o.created_at || "").slice(0, 10);
                add(byCustDay, `${o.customer_id}|${day}`, Number(o.total_amount || 0));
                add(orderAt, `${o.customer_id}|${day}`, d.id);
              }
              const refOf = (l) => { const m = String(l.note || "").match(/Excel ID:\s*([^\s·]+)/i); return m ? m[1] : ""; };
              for (const d of ops.docs) { const r = refOf(d.data()); if (r) { refs.add(r.toLowerCase()); add(refOrders, r.toLowerCase(), d.data().order_id); } }
              const paysOf = new Map();
              for (const d of pays.docs) { const p = d.data(); if (!paysOf.has(p.order_id)) paysOf.set(p.order_id, []); paysOf.get(p.order_id).push(Number(p.amount || 0)); }
              console.log(`DB customers=${cs.size} orders=${os.size} brands=${bs.size} refs=${refs.size}`);
              const out = [];
              for (const [i, ref, date, phones, nameH, brandH, total] of rows) {
                let cust = "X", ids = new Set();
                for (const ph of phones) for (const id of byPhone.get(ph) || []) ids.add(id);
                if (ids.size) cust = "P";
                else {
                  const n = byName.get(nameH) || new Set(), b = byBrand.get(brandH) || new Set();
                  const both = [...n].filter((x) => b.has(x));
                  if (both.length) { cust = "N"; both.forEach((x) => ids.add(x)); }
                  else if (b.size) { cust = "B"; b.forEach((x) => ids.add(x)); }
                }
                const iso = /^\d{2}\.\d{2}\.\d{4}$/.test(date) ? `${date.slice(6)}-${date.slice(3, 5)}-${date.slice(0, 2)}` : "";
                let ord = "X";
                const seen = [];
                if (ref && refs.has(String(ref).toLowerCase())) ord = "R";
                else for (const id of ids) {
                  const totals = byCustDay.get(`${id}|${iso}`);
                  if (!totals) continue;
                  seen.push(...totals);
                  ord = [...totals].some((t) => Math.abs(t - total) <= Math.max(1000, total * 0.02)) ? "M" : ord === "M" ? "M" : "D";
                }
                // ref: the orders behind an Excel ID, with each line's Excel ID, quantity and amount
                if (ord === "R" && process.env.INSPECT === "ref") {
                  for (const oid of refOrders.get(String(ref).toLowerCase()) || []) {
                    const doc = os.docs.find((x) => x.id === oid);
                    if (!doc) continue;
                    const o = doc.data();
                    const ls = (linesOf.get(oid) || []).map((l) => `${refOf(l) || "-"}|${l.quantity}|${l.total}`).join(";");
                    console.log(`REF ${i} ${oid} day=${String(o.order_date || "").slice(0, 10)} hist=${Boolean(o.is_historical)} total=${o.total_amount} sub=${o.subtotal} disc=${o.discount_amount || 0} paid=${o.paid_amount} rem=${o.remaining_amount} pays=${(paysOf.get(oid) || []).join("/")} lines=${ls}`);
                  }
                }
                // near: the customer's orders within 45 days of the row's date (amounts only)
                if (process.env.INSPECT === "near" && iso) {
                  for (const id of ids) for (const d of os.docs) {
                    const o = d.data();
                    if (o.customer_id !== id) continue;
                    const day = String(o.order_date || o.created_at || "").slice(0, 10);
                    if (Math.abs(Date.parse(day) - Date.parse(iso)) > 45 * 86400e3) continue;
                    const ls = (linesOf.get(d.id) || []).map((l) => `${l.quantity}x${l.unit_price}=${l.total}`).join(";");
                    console.log(`NEAR ${i} ${d.id} day=${day} hist=${Boolean(o.is_historical)} total=${o.total_amount} status=${o.status} lines=${ls}`);
                  }
                }
                // amounts only (no personal data): what the database has that day
                out.push(`${i}${cust}${ord}${ord === "D" ? ":" + seen.map((t) => Math.round(t)).join("/") : ""}`);
                if (ord === "D" && process.env.INSPECT === "yes") {
                  for (const id of ids) for (const oid of orderAt.get(`${id}|${iso}`) || []) {
                    const o = os.docs.find((x) => x.id === oid).data();
                    const ls = (linesOf.get(oid) || []).map((l) => `${l.quantity}x${l.unit_price}=${l.total}`).join(";");
                    console.log(`INSPECT ${i} ${oid} hist=${Boolean(o.is_historical)} batch=${o.import_batch ? "yes" : "no"} total=${o.total_amount} sub=${o.subtotal} disc=${o.discount_amount} paid=${o.paid_amount} rem=${o.remaining_amount} pays=${paidOf.get(oid) || 0} status=${o.status} made=${String(o.created_at || "").slice(0, 16)} lines=${ls}`);
                  }
                }
              }
              console.log("RESULT " + out.join(" "));
              process.exit(0);
            })().catch((e) => { console.error("check failed", e.message); process.exit(1); });
            JS
            NODE_PATH=/opt/meta-webhook/node_modules node /tmp/vp-check.js
            rm -f /tmp/vp-check.js
