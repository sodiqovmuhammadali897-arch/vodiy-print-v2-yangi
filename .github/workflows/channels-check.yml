name: App channels check (read only)

# Run by hand: which app version printvodiy.uz serves to everyone and to
# the owner's admin channel (cookie vp_channel=next). Reads only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare the two channels
        run: |
          for c in "" "vp_channel=next"; do
            s=$(curl -sS -m 20 -H "Cookie: $c" https://printvodiy.uz/ | grep -o '/assets/index-[^"]*\.js' | head -1)
            echo "${c:-everyone}: $s"
          done
          echo "index.html direct: $(curl -sS -m 20 https://printvodiy.uz/index.html | grep -o '/assets/index-[^"]*\.js' | head -1)"
          echo "deep link /orders: $(curl -sS -m 20 https://printvodiy.uz/orders | grep -o '/assets/index-[^"]*\.js' | head -1)"
          # Google Play files: the privacy policy page, the bundle and the app links.
          echo "privacy.html: $(curl -sS -m 20 -o /dev/null -w '%{http_code} %{content_type}' https://printvodiy.uz/privacy.html) · $(curl -sS -m 20 https://printvodiy.uz/privacy.html | grep -o '<title>[^<]*' | head -1)"
          echo "app.aab: $(curl -sS -m 20 -o /dev/null -I -w '%{http_code} %{content_type}' https://printvodiy.uz/app.aab)"
          echo "app.apk: $(curl -sS -m 20 -o /dev/null -I -w '%{http_code} %{content_type} %{size_download}' https://printvodiy.uz/app.apk) · $(curl -sS -m 30 https://printvodiy.uz/app.apk | wc -c) bytes"
          echo "assetlinks fingerprints: $(curl -sS -m 20 https://printvodiy.uz/.well-known/assetlinks.json | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | wc -l)"
