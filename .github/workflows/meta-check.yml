name: Instagram / Facebook check (read only)

# Run by hand: how far the ERP is connected to Instagram and Facebook —
# which settings are set (yes/no), whether the Page token works, which
# Instagram account and webhooks it sees, which agents are on, and counts
# of what arrived (Direct chats, form leads, ads sync). No tokens, no
# personal data — names of the business Page/account and counts only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            for k in META_VERIFY_TOKEN META_APP_SECRET META_PAGE_ACCESS_TOKEN META_ADS_TOKEN META_AD_ACCOUNT_ID META_PAGE_ID AI_AGENTS ERP_LEADS; do
              if grep -q "^$k=." /opt/meta-webhook/.env; then echo "$k: set"; else echo "$k: not set"; fi
            done
            echo "AI_AGENTS value: $(grep '^AI_AGENTS=' /opt/meta-webhook/.env | cut -d= -f2- || true) (default: staffbot,bosh,instagram)"
            for k in META_PAGE_ACCESS_TOKEN META_ADS_TOKEN META_AD_ACCOUNT_ID META_GRAPH_VERSION LEAD_MANAGERS RECALL_MANAGERS; do export $k="$(grep "^$k=" /opt/meta-webhook/.env | head -1 | cut -d= -f2-)"; done
            cat > /tmp/vp-meta.js <<'JS'
            const admin = require("/opt/meta-webhook/node_modules/firebase-admin");
            admin.initializeApp({ credential: admin.credential.cert(require("/opt/meta-webhook/service-account.json")) });
            const db = admin.firestore();
            const V = process.env.META_GRAPH_VERSION || "v19.0";
            const g = async (path, token) => {
              if (!token) return { error: { message: "no token" } };
              const r = await fetch(`https://graph.facebook.com/${V}/${path}${path.includes("?") ? "&" : "?"}access_token=${encodeURIComponent(token)}`);
              return r.json().catch(() => ({ error: { message: `HTTP ${r.status}` } }));
            };
            const err = (j) => (j && j.error ? `ERROR: ${j.error.message || JSON.stringify(j.error)}`.replace(/\d{8,}/g, "#") : "");
            (async () => {
              const T = process.env.META_PAGE_ACCESS_TOKEN;
              console.log("== Facebook Page token");
              const me = await g("me?fields=id,name,instagram_business_account{id,username},fan_count", T);
              console.log(err(me) || `page: ${me.name}; instagram: ${me.instagram_business_account ? "@" + me.instagram_business_account.username : "NOT linked"}`);
              const sub = await g("me/subscribed_apps", T);
              console.log(err(sub) || `webhook fields subscribed: ${((sub.data || [])[0]?.subscribed_fields || []).join(", ") || "none"}`);
              const dbg = await g(`debug_token?input_token=${encodeURIComponent(T || "")}`, T);
              if (!err(dbg) && dbg.data) console.log(`token valid: ${dbg.data.is_valid}; expires: ${dbg.data.expires_at ? new Date(dbg.data.expires_at * 1000).toISOString().slice(0, 10) : "never"}; scopes: ${(dbg.data.scopes || []).join(", ")}`);
              else console.log(`token debug: ${err(dbg) || "—"}`);
              console.log("== Ads token");
              const A = process.env.META_ADS_TOKEN, acc = process.env.META_AD_ACCOUNT_ID;
              const ad = acc ? await g(`${acc.startsWith("act_") ? acc : "act_" + acc}?fields=name,account_status,currency`, A) : { error: { message: "no ad account" } };
              console.log(err(ad) || `ad account: ${ad.name}; status ${ad.account_status}; ${ad.currency}`);
              console.log("== What arrived (counts)");
              const ig = (await db.collection("ig_conversations").get()).docs.map((d) => d.data());
              const last = ig.map((c) => c.updated_at).filter(Boolean).sort().pop();
              const fbc = ig.filter((c) => c.channel === "fb");
              console.log(`Instagram Direct conversations: ${ig.length - fbc.length}; Messenger: ${fbc.length}; with phone: ${ig.filter((c) => c.captured).length}; last: ${last || "—"}`);
              const cfg = (await db.collection("instagram_config").doc("main").get()).data() || {};
              console.log(`Instagram agent setting (Sozlamalar): enabled=${cfg.enabled === true}, reply_comments=${cfg.reply_comments === true}`);
              const leads = (await db.collection("leads").get()).docs.map((d) => d.data());
              for (const s of ["Instagram Direct", "Instagram izoh", "Instagram Target", "Facebook Lead Ads", "Facebook Messenger", "Sayt", "Telefon"]) {
                const l = leads.filter((x) => x.source === s);
                console.log(`ERP leads «${s}»: ${l.length}; last: ${l.map((x) => x.created_at).sort().pop() || "—"}`);
              }
              const sl = (await db.collection("site_leads").get()).docs.map((d) => d.data());
              console.log(`site form requests: ${sl.length}; last: ${sl.map((x) => x.created_at).sort().pop() || "—"}`);
              const st = (await db.collection("ads_state").doc("summary").get()).data();
              console.log(`ads sync (Targetolog): ${st ? `last ${st.last_sync || "—"}, campaigns ${st.campaigns ?? st.count ?? "?"}` : "never"}`);
              // New internet leads go to the managers in turn (assign.js).
              const RR = require("/opt/meta-webhook/assign.js");
              const staffAll = (await db.collection("staff").get()).docs.map((d) => ({ id: d.id, ...d.data() }));
              const turn = (await db.collection("crm_meta").doc("assign").get()).data() || {};
              console.log(`round-robin: ${RR.ON ? "on" : "off"}; managers: ${RR.pool(staffAll).map((x) => x.name).join(", ") || "— none"}; last given to: ${turn.last_name || "—"}`);
              // A named manager not found: show similar staff records (name and flags only).
              const nn = RR.normName;
              for (const want of String(process.env.LEAD_MANAGERS || "").split(",").map((x) => nn(x.trim().split(/\s+/)[0])).filter(Boolean)) {
                if (RR.pool(staffAll).some((p) => nn(String(p.name).split(/\s+/)[0]) === want)) continue;
                const near = staffAll.filter((x) => nn(x.full_name).includes(want.slice(0, 4)));
                console.log(`  «${want}» not matched; similar staff: ${near.map((x) => `«${x.full_name}» active=${x.active} is_active=${x.is_active} manager=${Boolean(x.report_manager_id)}`).join("; ") || "none"}`);
                // Staff whose phone matched a Mois Zvonki number but whose name differs (first letters only).
                console.log(`  staff linked to Mois Zvonki: ${staffAll.filter((x) => x.moizvonki_email || x.phone).map((x) => `${String(x.full_name || "").slice(0, 3)}… (${[...String(x.full_name || "")].filter((c) => c.charCodeAt(0) > 127).length} non-Latin chars)`).join(", ")}`);
              }
              process.exit(0);
            })().catch((e) => { console.error(e.message); process.exit(1); });
            JS
            node /tmp/vp-meta.js; rm -f /tmp/vp-meta.js
