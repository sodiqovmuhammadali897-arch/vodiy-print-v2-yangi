name: Diag attendance (temporary)

# Temporary: reads today's check-in/check-out Cloud Function logs and the
# admin's attendance records to debug a failing "Ishni tugatish".
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix functions
      - name: Cloud Function logs (last 12h)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          P=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/sa.json")).project_id)')
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=("attendancecheckout" OR "attendancecheckin")' \
            --project="$P" --freshness=12h --limit=60 \
            --format='table(timestamp.date("%H:%M:%S",tz=Asia/Tashkent),resource.labels.service_name,severity,httpRequest.status,textPayload,jsonPayload.message,jsonPayload.error)'
      - name: Attendance records
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cat > /tmp/diag.cjs <<'JS'
          const { initializeApp, cert } = require(process.cwd() + "/functions/node_modules/firebase-admin/app");
          const { getFirestore } = require(process.cwd() + "/functions/node_modules/firebase-admin/firestore");
          initializeApp({ credential: cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) });
          const db = getFirestore();
          (async () => {
            const staff = await db.collection("staff").get();
            const admins = staff.docs.filter((d) => d.data().role === "admin").map((d) => d.id);
            console.log("admins:", admins);
            for (const email of admins) {
              const snap = await db.collection("attendance").where("employeeId", "==", email).get();
              const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.dateCode).localeCompare(String(a.dateCode))).slice(0, 3);
              for (const r of rows) console.log(email, r.id, JSON.stringify({ dateCode: r.dateCode, in: r.checkInTime, out: r.checkOutTime, status: r.status, late: r.lateMinutes, lateNotifiedAt: r.lateNotifiedAt, updatedAt: r.updatedAt }));
            }
          })();
          JS
          node /tmp/diag.cjs
